name: Build Windows Game

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the Windows files to"
        required: false
        default: "v2.0.0"
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pyinstaller packaging/backroom_bratzz.spec --noconfirm
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/BackroomBratzz/* -DestinationPath dist/BackroomBratzz-Portable.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "2.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: BackroomBratzz-Windows-${{ github.run_number }}
          path: |
            dist/BackroomBratzz-Portable.zip
            dist/installer/BackroomBratzz-Setup.exe
      - name: Publish Windows release files
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        shell: pwsh
        run: |
          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            gh release upload "$env:RELEASE_TAG" `
              dist/BackroomBratzz-Portable.zip `
              dist/installer/BackroomBratzz-Setup.exe `
              --clobber
          } else {
            gh release create "$env:RELEASE_TAG" `
              dist/BackroomBratzz-Portable.zip `
              dist/installer/BackroomBratzz-Setup.exe `
              --generate-notes `
              --title "Backroom Bratzz $env:RELEASE_TAG"
          }
